server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PDF download
    location = /resume.pdf {
        try_files /resume.pdf =404;
    }

    # JSON data
    location = /resume.json {
        try_files /resume.json =404;
    }

    # Health check for Traefik
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
